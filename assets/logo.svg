<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#312e81"/>
      <stop offset="0.55" stop-color="#5b21b6"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.38" r="0.65">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <circle cx="256" cy="256" r="252" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="252" fill="url(#glow)"/>
  <circle cx="256" cy="256" r="238" fill="none" stroke="#fbbf24" stroke-opacity="0.35" stroke-width="3"/>

  <!-- Owl head silhouette -->
  <path d="M256 118
           C 168 118 122 176 122 250
           C 122 342 180 402 256 402
           C 332 402 390 342 390 250
           C 390 176 344 118 256 118 Z"
        fill="#1e1b4b"/>

  <!-- Ear tufts -->
  <path d="M138 190 L118 128 L182 158 Z" fill="#1e1b4b"/>
  <path d="M374 190 L394 128 L330 158 Z" fill="#1e1b4b"/>

  <!-- Chest feather plate -->
  <ellipse cx="256" cy="332" rx="86" ry="64" fill="#312e81"/>
  <g stroke="#fbbf24" stroke-opacity="0.55" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M212 318 l22 -16 l22 16"/>
    <path d="M256 318 l22 -16 l22 16"/>
    <path d="M234 350 l22 -16 l22 16"/>
  </g>

  <!-- Eyes -->
  <circle cx="196" cy="242" r="52" fill="#f8fafc"/>
  <circle cx="316" cy="242" r="52" fill="#f8fafc"/>
  <circle cx="203" cy="248" r="24" fill="#1e1b4b"/>
  <circle cx="309" cy="248" r="24" fill="#1e1b4b"/>
  <circle cx="210" cy="240" r="7" fill="#fbbf24"/>
  <circle cx="316" cy="240" r="7" fill="#fbbf24"/>

  <!-- Brow line connecting glasses-style eyes -->
  <rect x="238" y="230" width="36" height="10" rx="5" fill="#f8fafc"/>

  <!-- Beak -->
  <path d="M256 282 L238 300 L256 330 L274 300 Z" fill="#f59e0b"/>
  <path d="M256 282 L238 300 L256 306 Z" fill="#fbbf24"/>

  <!-- Graduation cap -->
  <g transform="translate(256,96)">
    <path d="M-108 26 L0 -14 L108 26 L0 62 Z" fill="url(#cap)"/>
    <path d="M-108 26 L0 62 L108 26 L108 40 L0 76 L-108 40 Z" fill="#0b1120"/>
    <rect x="-58" y="34" width="116" height="20" rx="6" fill="#1e293b"/>
    <!-- Tassel -->
    <line x1="88" y1="30" x2="92" y2="86" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>
    <circle cx="93" cy="94" r="10" fill="#fbbf24"/>
  </g>

  <!-- Sparkles -->
  <g fill="#fde68a">
    <path d="M96 320 l5 12 l12 5 l-12 5 l-5 12 l-5 -12 l-12 -5 l12 -5 Z"/>
    <path d="M420 140 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4 Z"/>
    <path d="M408 330 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 l8 -3 Z"/>
  </g>
</svg>
