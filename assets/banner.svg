  <!-- Wordmark -->
  <text x="430" y="205" font-family="'Segoe UI', Arial, sans-serif" font-size="104" font-weight="800" letter-spacing="10" fill="#f8fafc">ATHENA</text>
  <text x="434" y="268" font-family="'Segoe UI', Arial, sans-serif" font-size="34" font-weight="500" fill="#c4b5fd">Your study group co-pilot</text>

  <!-- Feature chips -->
