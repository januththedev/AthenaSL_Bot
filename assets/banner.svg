    <text x="491" y="343" text-anchor="middle" fill="#fde68a">/ask</text>

    <rect x="564" y="308" width="150" height="52" rx="26" fill="#ffffff" fill-opacity="0.10" stroke="#fbbf24" stroke-opacity="0.5"/>
    <text x="639" y="343" text-anchor="middle" fill="#fde68a">#notes</text>

