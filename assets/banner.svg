  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="28" fill="url(#glow)"/>
  <rect x="10" y="10" width="1180" height="400" rx="22" fill="none" stroke="#fbbf24" stroke-opacity="0.28" stroke-width="2"/>

  <!-- Owl emblem (compact version) -->
  <g transform="translate(56,56) scale(0.62)">
    <path d="M256 118 C 168 118 122 176 122 250 C 122 342 180 402 256 402 C 332 402 390 342 390 250 C 390 176 344 118 256 118 Z" fill="#ede9fe"/>
    <path d="M138 190 L118 128 L182 158 Z" fill="#ede9fe"/>
    <path d="M374 190 L394 128 L330 158 Z" fill="#ede9fe"/>
    <ellipse cx="256" cy="332" rx="86" ry="64" fill="#c4b5fd"/>
    <g stroke="#6d28d9" stroke-opacity="0.6" stroke-width="6" stroke-linecap="round" fill="none">
      <path d="M212 318 l22 -16 l22 16"/>
      <path d="M256 318 l22 -16 l22 16"/>
      <path d="M234 350 l22 -16 l22 16"/>
    </g>
    <circle cx="196" cy="242" r="52" fill="#1e1b4b"/>
    <circle cx="316" cy="242" r="52" fill="#1e1b4b"/>
    <circle cx="203" cy="248" r="24" fill="#fbbf24"/>
    <circle cx="309" cy="248" r="24" fill="#fbbf24"/>
    <rect x="238" y="230" width="36" height="10" rx="5" fill="#1e1b4b"/>
    <path d="M256 282 L238 300 L256 330 L274 300 Z" fill="#f59e0b"/>
    <g transform="translate(256,96)">
      <path d="M-108 26 L0 -14 L108 26 L0 62 Z" fill="url(#cap)"/>
      <path d="M-108 26 L0 62 L108 26 L108 40 L0 76 L-108 40 Z" fill="#0b1120"/>
      <line x1="88" y1="30" x2="92" y2="86" stroke="#fbbf24" stroke-width="7" stroke-linecap="round"/>
      <circle cx="93" cy="94" r="11" fill="#fbbf24"/>
    </g>
